name: ExcelAW Windows preview

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    # Reuse the established packaging pipeline. Dry run excludes paid macOS runners,
    # signing and publishing; downloadable Windows build artifacts are retained.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: gridcraft
      app-title: ExcelAW
      dry-run: true
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      has-web: false
      has-riscv64: false
      has-freebsd: false
      has-arch: false
      has-server: false
