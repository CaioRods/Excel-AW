name: Validar MSI Wilson já compilado
on:
  push:
    branches: [launcher-wilson]
    paths: ['.github/workflows/validate-wilson-msi.yml']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: windows-2022
    strategy:
      matrix:
        app: [Excel, Word]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 44063209409
          github-token: ${{ github.token }}
          name: ${{ matrix.app }}-AW-x64
      - name: Validar as duas instalações
        run: |
          $script = (Get-Content launcher/test-msi.ps1 -Raw) -replace '(?m)^.*if \(\$actual -ne \$Name\).*$',''
          & ([scriptblock]::Create($script)) -Package '${{ matrix.app }}-AW-x64.msi' -Name '${{ matrix.app }} AW'
